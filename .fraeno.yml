version: 1

project:
  name: fraeno-live-ros2-fixture

validation:
  steps:
    - name: build ROS 2 fixture
      command:
        - bash
        - -lc
        - >-
          cd fixtures/ros2_qos_robot &&
          colcon build --event-handlers console_direct+
      timeout_seconds: 300
  observe:
    command:
      - bash
      - -lc
      - >-
        cd fixtures/ros2_qos_robot &&
        source install/setup.bash &&
        python3 observe.py
    timeout_seconds: 45
  contract:
    required_nodes:
      - /sensor_driver
      - /controller
    required_topics:
      - /sensor/reading
      - /robot/command
    required_services:
      - /robot/health
    minimum_topic_rates_hz:
      /sensor/reading: 15
      /robot/command: 7
    maximum_topic_rate_regression_percent: 30
