version: 1

project:
  name: fraeno-live-ros2-fixture

validation:
  steps:
    - name: build ROS 2 fixture
      command:
        - bash
        - -lc
        - >-
          cd fixtures/ros2_qos_robot &&
          colcon build --event-handlers console_direct+
      timeout_seconds: 300
  observe:
    command:
      - bash
      - -lc
      - >-
        cd fixtures/ros2_qos_robot &&
        source install/setup.bash &&
        python3 -m fraeno.cli observe-ros2
        --config "$FRAENO_TRUSTED_ROOT/.fraeno.yml"
    timeout_seconds: 45
    ros2:
      launch_command:
        - ros2
        - launch
        - fraeno_ros_fixture
        - robot.launch.py
      warmup_seconds: 1
      graph_stabilization_timeout_seconds: 10
      graph_stabilization_interval_seconds: 0.2
      graph_stabilization_samples: 3
      sample_seconds: 2
      measurement_repetitions: 3
      rate_topics:
        - /sensor/reading
        - /robot/command
      diagnostics_topics:
        - /diagnostics
      transform_topics:
        - /tf_static
      shutdown_timeout_seconds: 5
  contract:
    required_nodes:
      - /sensor_driver
      - /controller
    required_topics:
      - /sensor/reading
      - /robot/command
    required_services:
      - /robot/health
    required_actions:
      - /robot/move
    required_transforms:
      - base_link->sensor_link
    required_diagnostics:
      - controller
      - sensor_driver
    minimum_topic_rates_hz:
      /sensor/reading: 15
      /robot/command: 7
    maximum_topic_rate_regression_percent: 30
