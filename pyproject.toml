[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "fraeno"
version = "0.2.3"
description = "Robot dependency updates with complete-system integration testing."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
authors = [{ name = "Thabhelo Duve" }]
dependencies = [
  "httpx>=0.27,<1",
  "packaging>=24.1,<27",
  "PyYAML>=6.0.2,<7",
  "tomli>=2.0,<3",
]

[project.optional-dependencies]
app = [
  "cryptography>=43,<47",
  "fastapi>=0.115,<1",
  "google-cloud-firestore>=2.19,<3",
  "google-cloud-tasks>=2.19,<3",
  "PyJWT>=2.9,<3",
  "uvicorn[standard]>=0.32,<1",
]
dev = [
  "mypy>=1.13,<2",
  "pytest>=8.3,<10",
  "pytest-cov>=6,<8",
  "ruff>=0.8,<1",
  "types-PyYAML>=6.0.12,<7",
]

[project.scripts]
fraeno = "fraeno.cli:main"
fraeno-fixture-observe = "fraeno.fixture_observer:main"
fraeno-github-ops = "fraeno.github_app.operations:main"

[tool.hatch.build.targets.wheel]
packages = ["src/fraeno"]

[tool.hatch.build.targets.wheel.force-include]
"templates/github" = "fraeno/templates/github"

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.10"
strict = true
packages = ["fraeno"]

[[tool.mypy.overrides]]
module = ["google.cloud", "google.cloud.*"]
ignore_missing_imports = true
