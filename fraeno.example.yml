version: 1

project:
  name: example-robot

validation:
  steps:
    - name: build ROS 2 workspace
      command: ["colcon", "build"]
      timeout_seconds: 300
  observe:
    command:
      - bash
      - -lc
      - >-
        source install/setup.bash &&
        fraeno observe-ros2 --config "$FRAENO_TRUSTED_ROOT/.fraeno.yml"
    timeout_seconds: 60
    ros2:
      launch_command:
        - ros2
        - launch
        - my_robot_bringup
        - system.launch.py
      warmup_seconds: 2
      graph_stabilization_timeout_seconds: 15
      graph_stabilization_interval_seconds: 0.25
      graph_stabilization_samples: 3
      sample_seconds: 5
      measurement_repetitions: 3
      rate_topics:
        - /sensor/reading
        - /robot/command
      diagnostics_topics:
        - /diagnostics
      transform_topics:
        - /tf
        - /tf_static
      shutdown_timeout_seconds: 5
  contract:
    required_nodes:
      - /sensor_driver
      - /controller
    required_topics:
      - /sensor/reading
      - /robot/command
    required_services:
      - /robot/health
    required_actions:
      - /robot/move
    required_transforms:
      - base_link->sensor_link
    required_diagnostics:
      - controller
    minimum_topic_rates_hz:
      /sensor/reading: 15
      /robot/command: 7
    maximum_topic_rate_regression_percent: 30
    allowed_missing_baseline_entities:
      - topic:/temporary/debug
