name: Fraeno robot integration
run-name: Fraeno ${{ inputs.delivery_id }}

on:
  workflow_dispatch:
    inputs:
      base_sha:
        description: Trusted base commit
        required: true
        type: string
      head_sha:
        description: Candidate commit
        required: true
        type: string
      base_repository:
        description: Trusted base repository
        required: true
        type: string
      head_repository:
        description: Candidate repository
        required: true
        type: string
      pull_request_number:
        description: Pull request number
        required: true
        type: string
      check_run_id:
        description: Fraeno check run
        required: true
        type: string
      delivery_id:
        description: GitHub webhook delivery
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: fraeno-pr-${{ inputs.pull_request_number }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Check out trusted baseline
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: ${{ inputs.base_repository }}
          ref: ${{ inputs.base_sha }}
          path: baseline
          persist-credentials: false

      - name: Check out candidate
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: ${{ inputs.head_repository }}
          ref: ${{ inputs.head_sha }}
          path: candidate
          persist-credentials: false

      - name: Build trusted Fraeno runner
        run: |
          docker build \
            --file baseline/runner/Dockerfile \
            --tag fraeno-runner:${{ inputs.check_run_id }} \
            baseline
          image_id="$(docker image inspect \
            --format '{{.Id}}' \
            fraeno-runner:${{ inputs.check_run_id }})"
          echo "FRAENO_RUNNER_IMAGE=$image_id" >> "$GITHUB_ENV"

      - name: Validate in separate sandboxes
        run: >-
          bash baseline/runner/run-isolated-validation.sh
          "$FRAENO_RUNNER_IMAGE"
          "$PWD/baseline"
          "$PWD/candidate"
          "$PWD/baseline/.fraeno.yml"
          "$PWD/fraeno-report.json"

      - name: Upload complete Fraeno report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fraeno-report-${{ inputs.check_run_id }}
          path: fraeno-report.json
          if-no-files-found: error
          retention-days: 14
