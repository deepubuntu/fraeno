name: Verify staged credential rotation
run-name: ${{ inputs.mode }} credential rotation from webhook ${{ inputs.webhook_previous_version }} to ${{ inputs.webhook_active_version }}

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Dry run checks metadata only. Stage creates zero-traffic revisions and verifies them.
        required: true
        default: dry-run
        type: choice
        options:
          - dry-run
          - stage
      webhook_active_version:
        description: Exact enabled Secret Manager version for the new webhook secret
        required: true
        type: string
      webhook_previous_version:
        description: Exact enabled Secret Manager version for the current webhook secret
        required: true
        type: string
      private_key_active_version:
        description: Exact enabled Secret Manager version for the new App private key
        required: true
        type: string
      private_key_previous_version:
        description: Exact enabled Secret Manager version for the current App private key
        required: true
        type: string
      expected_webhook_revision:
        description: Current revision receiving all webhook traffic
        required: true
        type: string
      expected_worker_revision:
        description: Current revision receiving all worker traffic
        required: true
        type: string
      confirmation:
        description: Enter STAGE_FRAENO_ROTATION for stage mode
        required: false
        default: none
        type: string

permissions:
  contents: read

concurrency:
  group: fraeno-control-plane-production
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out the reviewed automation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Test the credential-rotation code
        run: |
          python -m pip install ".[dev,app]"
          pytest tests/test_credential_rotation.py \
            tests/test_github_app.py \
            tests/test_github_auth.py \
            tests/test_github_client.py
          ruff check src/fraeno/credential_rotation.py \
            src/fraeno/github_app \
            tests/test_credential_rotation.py
          mypy --strict src

  verify:
    needs: test
    environment: credential-rotation
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    env:
      MODE: ${{ inputs.mode }}
      WEBHOOK_ACTIVE_VERSION: ${{ inputs.webhook_active_version }}
      WEBHOOK_PREVIOUS_VERSION: ${{ inputs.webhook_previous_version }}
      PRIVATE_KEY_ACTIVE_VERSION: ${{ inputs.private_key_active_version }}
      PRIVATE_KEY_PREVIOUS_VERSION: ${{ inputs.private_key_previous_version }}
      EXPECTED_WEBHOOK_REVISION: ${{ inputs.expected_webhook_revision }}
      EXPECTED_WORKER_REVISION: ${{ inputs.expected_worker_revision }}
      CONFIRMATION: ${{ inputs.confirmation }}
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCP_LOCATION: ${{ vars.GCP_LOCATION }}
      GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
      GCP_ROTATION_SERVICE_ACCOUNT: ${{ vars.GCP_ROTATION_SERVICE_ACCOUNT }}
      EXPECTED_GCP_PROJECT_ID: deepubuntu-32f9e
      EXPECTED_GCP_LOCATION: us-central1
      EXPECTED_GCP_WORKLOAD_IDENTITY_PROVIDER: projects/286435890377/locations/global/workloadIdentityPools/fraeno-github/providers/fraeno-credential-rotation
      EXPECTED_GCP_ROTATION_SERVICE_ACCOUNT: fraeno-credential-rotator@deepubuntu-32f9e.iam.gserviceaccount.com
      WEBHOOK_SERVICE: fraeno-github-webhook
      WORKER_SERVICE: fraeno-github-worker
      WEBHOOK_RUNTIME_SERVICE_ACCOUNT: fraeno-webhook@deepubuntu-32f9e.iam.gserviceaccount.com
      WORKER_RUNTIME_SERVICE_ACCOUNT: fraeno-worker@deepubuntu-32f9e.iam.gserviceaccount.com
      WEBHOOK_SECRET: fraeno-github-webhook-secret
      PRIVATE_KEY_SECRET: fraeno-github-private-key
      CANDIDATE_TAG: credential-${{ github.run_id }}
      PYTHONPATH: src
    steps:
      - name: Check out the reviewed automation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"

      - name: Validate the requested operation
        run: |
          python -S - "$MODE" \
            "$WEBHOOK_ACTIVE_VERSION" \
            "$WEBHOOK_PREVIOUS_VERSION" \
            "$PRIVATE_KEY_ACTIVE_VERSION" \
            "$PRIVATE_KEY_PREVIOUS_VERSION" \
            "$EXPECTED_WEBHOOK_REVISION" \
            "$EXPECTED_WORKER_REVISION" \
            "$CONFIRMATION" <<'PY'
          import re
          import sys

          (
              mode,
              webhook_active,
              webhook_previous,
              key_active,
              key_previous,
              webhook_revision,
              worker_revision,
              confirmation,
          ) = sys.argv[1:]
          if mode not in {"dry-run", "stage"}:
              raise SystemExit("mode must be dry-run or stage")
          for name, value in (
              ("webhook_active_version", webhook_active),
              ("webhook_previous_version", webhook_previous),
              ("private_key_active_version", key_active),
              ("private_key_previous_version", key_previous),
          ):
              if re.fullmatch(r"[1-9][0-9]*", value) is None:
                  raise SystemExit(f"{name} must be an exact numeric version")
          if webhook_active == webhook_previous:
              raise SystemExit("webhook versions must differ")
          if key_active == key_previous:
              raise SystemExit("private-key versions must differ")
          expected = {
              "expected_webhook_revision": "fraeno-github-webhook-",
              "expected_worker_revision": "fraeno-github-worker-",
          }
          for name, value in (
              ("expected_webhook_revision", webhook_revision),
              ("expected_worker_revision", worker_revision),
          ):
              if (
                  re.fullmatch(r"[a-z][a-z0-9-]{0,62}", value) is None
                  or not value.startswith(expected[name])
              ):
                  raise SystemExit(f"{name} is not an exact service revision")
          if mode == "stage" and confirmation != "STAGE_FRAENO_ROTATION":
              raise SystemExit(
                  "stage mode requires confirmation STAGE_FRAENO_ROTATION"
              )
          if mode == "dry-run" and confirmation != "none":
              raise SystemExit("dry-run mode requires the default confirmation")
          PY

      - name: Require exact Google configuration
        run: |
          for name in \
            GCP_PROJECT_ID \
            GCP_LOCATION \
            GCP_WORKLOAD_IDENTITY_PROVIDER \
            GCP_ROTATION_SERVICE_ACCOUNT
          do
            if [[ -z "${!name}" ]]; then
              echo "Missing credential-rotation variable $name" >&2
              exit 2
            fi
          done
          test "$GCP_PROJECT_ID" = "$EXPECTED_GCP_PROJECT_ID"
          test "$GCP_LOCATION" = "$EXPECTED_GCP_LOCATION"
          test "$GCP_WORKLOAD_IDENTITY_PROVIDER" = \
            "$EXPECTED_GCP_WORKLOAD_IDENTITY_PROVIDER"
          test "$GCP_ROTATION_SERVICE_ACCOUNT" = \
            "$EXPECTED_GCP_ROTATION_SERVICE_ACCOUNT"

      - name: Authenticate to Google Cloud with workload identity
        id: gcp-auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_ROTATION_SERVICE_ACCOUNT }}

      - name: Set up Google Cloud
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}

      - name: Require exact versions and unchanged production
        id: production-state
        run: |
          set -Eeuo pipefail
          for pair in \
            "$WEBHOOK_SECRET:$WEBHOOK_ACTIVE_VERSION" \
            "$WEBHOOK_SECRET:$WEBHOOK_PREVIOUS_VERSION" \
            "$PRIVATE_KEY_SECRET:$PRIVATE_KEY_ACTIVE_VERSION" \
            "$PRIVATE_KEY_SECRET:$PRIVATE_KEY_PREVIOUS_VERSION"
          do
            secret="${pair%%:*}"
            version="${pair##*:}"
            state="$(
              gcloud secrets versions describe "$version" \
                --secret "$secret" \
                --project "$GCP_PROJECT_ID" \
                --format "value(state)"
            )"
            test "$state" = "ENABLED"
          done

          gcloud run services describe "$WEBHOOK_SERVICE" \
            --project "$GCP_PROJECT_ID" \
            --region "$GCP_LOCATION" \
            --format json > current-webhook-service.json
          gcloud run services describe "$WORKER_SERVICE" \
            --project "$GCP_PROJECT_ID" \
            --region "$GCP_LOCATION" \
            --format json > current-worker-service.json
          gcloud run revisions describe "$EXPECTED_WEBHOOK_REVISION" \
            --project "$GCP_PROJECT_ID" \
            --region "$GCP_LOCATION" \
            --format json > current-webhook-revision.json
          gcloud run revisions describe "$EXPECTED_WORKER_REVISION" \
            --project "$GCP_PROJECT_ID" \
            --region "$GCP_LOCATION" \
            --format json > current-worker-revision.json
          python -S -m fraeno.control_release inspect-service \
            --input current-webhook-service.json \
            --revision-input current-webhook-revision.json \
            --service "$WEBHOOK_SERVICE" \
            --revision "$EXPECTED_WEBHOOK_REVISION" \
            --service-account "$WEBHOOK_RUNTIME_SERVICE_ACCOUNT" \
            --output current-webhook.json
          python -S -m fraeno.control_release inspect-service \
            --input current-worker-service.json \
            --revision-input current-worker-revision.json \
            --service "$WORKER_SERVICE" \
            --revision "$EXPECTED_WORKER_REVISION" \
            --service-account "$WORKER_RUNTIME_SERVICE_ACCOUNT" \
            --output current-worker.json
          python -S -m fraeno.credential_rotation inspect-source \
            --webhook-revision current-webhook-revision.json \
            --worker-revision current-worker-revision.json \
            --webhook-previous-version "$WEBHOOK_PREVIOUS_VERSION" \
            --private-key-previous-version "$PRIVATE_KEY_PREVIOUS_VERSION" \
            --output current-credential-source.json
          readarray -t reviewed_runtime < <(python -S - <<'PY'
          import json
          import os

          webhook = json.load(open("current-webhook.json"))
          worker = json.load(open("current-worker.json"))
          for role in ("webhook", "worker"):
              service = json.load(open(f"current-{role}-service.json"))
              if any(
                  item.get("tag") == os.environ["CANDIDATE_TAG"]
                  for item in service["status"].get("traffic", [])
              ):
                  raise SystemExit(
                      f"{role} already has this run's candidate tag"
                  )
          print(webhook["image"])
          print(worker["image"])
          print(webhook["service_account"])
          print(worker["service_account"])
          PY
          )
          {
            echo "WEBHOOK_ACTIVE_IMAGE=${reviewed_runtime[0]}"
            echo "WORKER_ACTIVE_IMAGE=${reviewed_runtime[1]}"
            echo "WEBHOOK_ACTIVE_SERVICE_ACCOUNT=${reviewed_runtime[2]}"
            echo "WORKER_ACTIVE_SERVICE_ACCOUNT=${reviewed_runtime[3]}"
          } >> "$GITHUB_ENV"
          worker_audience="$(
            python -S - "$WORKER_SERVICE" <<'PY'
          import json
          import sys
          from urllib.parse import urlsplit

          service = sys.argv[1]
          url = json.load(open("current-worker.json"))["url"]
          parsed = urlsplit(url)
          if (
              parsed.scheme != "https"
              or parsed.username is not None
              or parsed.password is not None
              or parsed.port is not None
              or parsed.path not in {"", "/"}
              or parsed.query
              or parsed.fragment
              or parsed.hostname is None
              or not parsed.hostname.endswith(".a.run.app")
              or not parsed.hostname.startswith(f"{service}-")
              or "\n" in url
              or "\r" in url
          ):
              raise SystemExit("worker service URL is not a canonical run.app URL")
          print(url.removesuffix("/"))
          PY
          )"
          echo "worker_audience=$worker_audience" >> "$GITHUB_OUTPUT"

          cat > credential-rotation-plan.json <<JSON
          {
            "schema_version": 1,
            "mode": "$MODE",
            "project": "$GCP_PROJECT_ID",
            "location": "$GCP_LOCATION",
            "webhook": {
              "active_version": "$WEBHOOK_ACTIVE_VERSION",
              "previous_version": "$WEBHOOK_PREVIOUS_VERSION",
              "production_revision": "$EXPECTED_WEBHOOK_REVISION",
              "image": "${reviewed_runtime[0]}",
              "service_account": "${reviewed_runtime[2]}"
            },
            "private_key": {
              "active_version": "$PRIVATE_KEY_ACTIVE_VERSION",
              "previous_version": "$PRIVATE_KEY_PREVIOUS_VERSION",
              "production_revision": "$EXPECTED_WORKER_REVISION",
              "image": "${reviewed_runtime[1]}",
              "service_account": "${reviewed_runtime[3]}"
            },
            "production_traffic_mutated": false,
            "service_configuration_mutated": false,
            "candidate_revisions": null
          }
          JSON

      - name: Stop after the metadata-only dry run
        if: inputs.mode == 'dry-run'
        run: |
          echo "Dry run passed. No Cloud Run service or secret version was changed."

      - name: Create tagged zero-traffic revisions
        if: inputs.mode == 'stage'
        run: |
          set -Eeuo pipefail
          started_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          previous_valid_until="$(
            date -u -d "$started_at + 1 hour" +%Y-%m-%dT%H:%M:%SZ
          )"
          run_tail="${GITHUB_RUN_ID: -8}"
          suffix="cred-${run_tail}-${GITHUB_RUN_ATTEMPT}"
          tag="$CANDIDATE_TAG"
          webhook_revision="$WEBHOOK_SERVICE-$suffix"
          worker_revision="$WORKER_SERVICE-$suffix"

          assert_production_traffic() {
            for role in webhook worker
            do
              local service_var="${role^^}_SERVICE"
              local revision_var="EXPECTED_${role^^}_REVISION"
              local service="${!service_var}"
              local revision="${!revision_var}"
              gcloud run services describe "$service" \
                --project "$GCP_PROJECT_ID" \
                --region "$GCP_LOCATION" \
                --format json > "traffic-$role.json"
              python -S - "$role" "$revision" <<'PY'
          import json
          import sys

          role, expected = sys.argv[1:]
          payload = json.load(open(f"traffic-{role}.json"))
          active = [
              item
              for item in payload["status"]["traffic"]
              if int(item.get("percent") or 0) > 0
          ]
          if (
              len(active) != 1
              or active[0].get("revisionName") != expected
              or active[0].get("percent") != 100
          ):
              raise SystemExit(f"{role} production traffic changed")
          PY
            done
          }

          printf "%s" "$webhook_revision" \
            > "$RUNNER_TEMP/fraeno-webhook-candidate-revision"
          gcloud run services update "$WEBHOOK_SERVICE" \
            --project "$GCP_PROJECT_ID" \
            --region "$GCP_LOCATION" \
            --image "$WEBHOOK_ACTIVE_IMAGE" \
            --service-account "$WEBHOOK_ACTIVE_SERVICE_ACCOUNT" \
            --no-traffic \
            --tag "$tag" \
            --revision-suffix "$suffix" \
            --update-secrets \
              "FRAENO_GITHUB_WEBHOOK_SECRET=$WEBHOOK_SECRET:$WEBHOOK_ACTIVE_VERSION,FRAENO_GITHUB_WEBHOOK_SECRET_PREVIOUS=$WEBHOOK_SECRET:$WEBHOOK_PREVIOUS_VERSION" \
            --update-env-vars \
              "FRAENO_CREDENTIAL_ROTATION_STARTED_AT=$started_at,FRAENO_PREVIOUS_CREDENTIALS_VALID_UNTIL=$previous_valid_until" \
            --quiet >/dev/null
          assert_production_traffic
          printf "%s" "$worker_revision" \
            > "$RUNNER_TEMP/fraeno-worker-candidate-revision"
          gcloud run services update "$WORKER_SERVICE" \
            --project "$GCP_PROJECT_ID" \
            --region "$GCP_LOCATION" \
            --image "$WORKER_ACTIVE_IMAGE" \
            --service-account "$WORKER_ACTIVE_SERVICE_ACCOUNT" \
            --no-traffic \
            --tag "$tag" \
            --revision-suffix "$suffix" \
            --update-secrets \
              "FRAENO_GITHUB_PRIVATE_KEY=$PRIVATE_KEY_SECRET:$PRIVATE_KEY_ACTIVE_VERSION,FRAENO_GITHUB_PRIVATE_KEY_PREVIOUS=$PRIVATE_KEY_SECRET:$PRIVATE_KEY_PREVIOUS_VERSION" \
            --update-env-vars \
              "FRAENO_CREDENTIAL_ROTATION_STARTED_AT=$started_at,FRAENO_PREVIOUS_CREDENTIALS_VALID_UNTIL=$previous_valid_until" \
            --quiet >/dev/null
          assert_production_traffic

          {
            echo "ROTATION_STARTED_AT=$started_at"
            echo "PREVIOUS_VALID_UNTIL=$previous_valid_until"
            echo "WEBHOOK_CANDIDATE_REVISION=$webhook_revision"
            echo "WORKER_CANDIDATE_REVISION=$worker_revision"
          } >> "$GITHUB_ENV"

      - name: Inspect exact staged revisions
        if: inputs.mode == 'stage'
        run: |
          set -Eeuo pipefail
          gcloud run services describe "$WEBHOOK_SERVICE" \
            --project "$GCP_PROJECT_ID" \
            --region "$GCP_LOCATION" \
            --format json > staged-webhook-service.json
          gcloud run revisions describe "$WEBHOOK_CANDIDATE_REVISION" \
            --project "$GCP_PROJECT_ID" \
            --region "$GCP_LOCATION" \
            --format json > staged-webhook-revision.json
          gcloud run services describe "$WORKER_SERVICE" \
            --project "$GCP_PROJECT_ID" \
            --region "$GCP_LOCATION" \
            --format json > staged-worker-service.json
          gcloud run revisions describe "$WORKER_CANDIDATE_REVISION" \
            --project "$GCP_PROJECT_ID" \
            --region "$GCP_LOCATION" \
            --format json > staged-worker-revision.json
          python -S -m fraeno.credential_rotation inspect-stage \
            --webhook-service staged-webhook-service.json \
            --webhook-revision staged-webhook-revision.json \
            --active-webhook-revision current-webhook-revision.json \
            --worker-service staged-worker-service.json \
            --worker-revision staged-worker-revision.json \
            --active-worker-revision current-worker-revision.json \
            --webhook-revision-name "$WEBHOOK_CANDIDATE_REVISION" \
            --worker-revision-name "$WORKER_CANDIDATE_REVISION" \
            --webhook-active-version "$WEBHOOK_ACTIVE_VERSION" \
            --webhook-previous-version "$WEBHOOK_PREVIOUS_VERSION" \
            --private-key-active-version "$PRIVATE_KEY_ACTIVE_VERSION" \
            --private-key-previous-version "$PRIVATE_KEY_PREVIOUS_VERSION" \
            --webhook-image "$WEBHOOK_ACTIVE_IMAGE" \
            --worker-image "$WORKER_ACTIVE_IMAGE" \
            --webhook-service-account "$WEBHOOK_ACTIVE_SERVICE_ACCOUNT" \
            --worker-service-account "$WORKER_ACTIVE_SERVICE_ACCOUNT" \
            --started-at "$ROTATION_STARTED_AT" \
            --previous-valid-until "$PREVIOUS_VALID_UNTIL" \
            --output staged-rotation.json
          python -S - <<'PY'
          import json

          plan = json.load(open("credential-rotation-plan.json"))
          stage = json.load(open("staged-rotation.json"))
          plan["service_configuration_mutated"] = True
          plan["candidate_revisions"] = {
              role: service["revision"]
              for role, service in stage["services"].items()
          }
          with open("credential-rotation-plan.json", "w") as destination:
              json.dump(plan, destination, indent=2, sort_keys=True)
              destination.write("\n")
          PY

      - name: Mint the private worker verification token
        if: inputs.mode == 'stage'
        id: worker-token
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_ROTATION_SERVICE_ACCOUNT }}
          token_format: id_token
          id_token_audience: ${{ steps.production-state.outputs.worker_audience }}
          create_credentials_file: false
          export_environment_variables: false

      - name: Verify both staged webhook secrets and App keys
        if: inputs.mode == 'stage'
        env:
          FRAENO_WORKER_ID_TOKEN: ${{ steps.worker-token.outputs.id_token }}
        run: |
          set -Eeuo pipefail
          if [[ -z "${FRAENO_WORKER_ID_TOKEN:-}" ]]; then
            echo "The private worker verification token is missing." >&2
            exit 2
          fi
          credential_dir="$RUNNER_TEMP/fraeno-credential-rotation"
          umask 077
          mkdir "$credential_dir"
          gcloud secrets versions access "$WEBHOOK_ACTIVE_VERSION" \
            --secret "$WEBHOOK_SECRET" \
            --project "$GCP_PROJECT_ID" \
            --out-file "$credential_dir/webhook-active"
          gcloud secrets versions access "$WEBHOOK_PREVIOUS_VERSION" \
            --secret "$WEBHOOK_SECRET" \
            --project "$GCP_PROJECT_ID" \
            --out-file "$credential_dir/webhook-previous"
          python -S -m fraeno.credential_rotation probe-stage \
            --stage staged-rotation.json \
            --active-webhook-secret-file "$credential_dir/webhook-active" \
            --previous-webhook-secret-file "$credential_dir/webhook-previous" \
            --output credential-rotation-evidence.json
          sha256sum credential-rotation-evidence.json \
            > credential-rotation-evidence.json.sha256
          rm -f \
            "$credential_dir/webhook-active" \
            "$credential_dir/webhook-previous"
          rmdir "$credential_dir"

      - name: Preserve secret-free rotation evidence
        if: inputs.mode == 'stage'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fraeno-credential-rotation-${{ github.run_id }}
          path: |
            credential-rotation-plan.json
            staged-rotation.json
            credential-rotation-evidence.json
            credential-rotation-evidence.json.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Remove any local credential material
        if: always()
        run: |
          credential_dir="$RUNNER_TEMP/fraeno-credential-rotation"
          rm -f \
            "$credential_dir/webhook-active" \
            "$credential_dir/webhook-previous"
          rmdir "$credential_dir" 2>/dev/null || true

      - name: Remove only this run's candidate tags and confirm production
        if: always() && inputs.mode == 'stage' && steps.gcp-auth.outcome == 'success'
        run: |
          set -Euo pipefail
          cleanup_failed=0
          for role in webhook worker
          do
            service_var="${role^^}_SERVICE"
            revision_var="EXPECTED_${role^^}_REVISION"
            service="${!service_var}"
            revision="${!revision_var}"
            marker="$RUNNER_TEMP/fraeno-${role}-candidate-revision"
            expected_latest_revision=""
            if [[ -f "$marker" ]]; then
              candidate_revision="$(<"$marker")"
              run_tail="${GITHUB_RUN_ID: -8}"
              restore_suffix="restore-${run_tail}-${GITHUB_RUN_ATTEMPT}"
              restore_revision="$service-$restore_suffix"
              expected_latest_revision="$restore_revision"
              image_var="${role^^}_ACTIVE_IMAGE"
              account_var="${role^^}_ACTIVE_SERVICE_ACCOUNT"
              image="${!image_var}"
              account="${!account_var}"
              if [[ "$role" = webhook ]]; then
                active_secret="FRAENO_GITHUB_WEBHOOK_SECRET=$WEBHOOK_SECRET:$WEBHOOK_PREVIOUS_VERSION"
                previous_secret="FRAENO_GITHUB_WEBHOOK_SECRET_PREVIOUS"
              else
                active_secret="FRAENO_GITHUB_PRIVATE_KEY=$PRIVATE_KEY_SECRET:$PRIVATE_KEY_PREVIOUS_VERSION"
                previous_secret="FRAENO_GITHUB_PRIVATE_KEY_PREVIOUS"
              fi
              if gcloud run services update "$service" \
                  --project "$GCP_PROJECT_ID" \
                  --region "$GCP_LOCATION" \
                  --image "$image" \
                  --service-account "$account" \
                  --no-traffic \
                  --revision-suffix "$restore_suffix" \
                  --update-secrets "$active_secret" \
                  --remove-secrets "$previous_secret" \
                  --remove-env-vars \
                    "FRAENO_CREDENTIAL_ROTATION_STARTED_AT,FRAENO_PREVIOUS_CREDENTIALS_VALID_UNTIL" \
                  --quiet >/dev/null
              then
                if gcloud run revisions describe "$restore_revision" \
                    --project "$GCP_PROJECT_ID" \
                    --region "$GCP_LOCATION" \
                    --format json > "restored-$role-revision.json"
                then
                  if ! python -S -m fraeno.credential_rotation validate-restore \
                    --revision "restored-$role-revision.json" \
                    --active-revision "current-$role-revision.json" \
                    --role "$role" \
                    --expected-revision "$restore_revision" \
                    --output "restore-validation-$role.json"
                  then
                    cleanup_failed=1
                  fi
                else
                  cleanup_failed=1
                fi
              else
                cleanup_failed=1
              fi

              if gcloud run services describe "$service" \
                  --project "$GCP_PROJECT_ID" \
                  --region "$GCP_LOCATION" \
                  --format json > "cleanup-$role.json"
              then
                if python -S - \
                  "$role" \
                  "$candidate_revision" \
                  "$CANDIDATE_TAG" <<'PY'
          import json
          import sys

          role, expected_revision, expected_tag = sys.argv[1:]
          payload = json.load(open(f"cleanup-{role}.json"))
          tagged = [
              item
              for item in payload["status"].get("traffic", [])
              if item.get("tag") == expected_tag
          ]
          if (
              len(tagged) != 1
              or tagged[0].get("revisionName") != expected_revision
              or int(tagged[0].get("percent") or 0) != 0
          ):
              raise SystemExit(
                  f"{role} candidate tag no longer identifies this run"
              )
          PY
                then
                  if ! gcloud run services update-traffic "$service" \
                    --project "$GCP_PROJECT_ID" \
                    --region "$GCP_LOCATION" \
                    --remove-tags "$CANDIDATE_TAG" \
                    --quiet >/dev/null
                  then
                    cleanup_failed=1
                  fi
                else
                  cleanup_failed=1
                fi
              else
                cleanup_failed=1
              fi
            fi

            if gcloud run services describe "$service" \
                --project "$GCP_PROJECT_ID" \
                --region "$GCP_LOCATION" \
                --format json > "final-traffic-$role.json"
            then
              if ! python -S -m fraeno.credential_rotation validate-cleanup \
                --service "final-traffic-$role.json" \
                --role "$role" \
                --expected-revision "$revision" \
                --candidate-tag "$CANDIDATE_TAG" \
                --expected-latest-revision "$expected_latest_revision" \
                --output "cleanup-validation-$role.json"
              then
                cleanup_failed=1
              fi
            else
              cleanup_failed=1
            fi
          done
          exit "$cleanup_failed"
