name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  wheel:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.10"
      - run: python -m pip install build
      - run: python -m build --wheel
      - run: |
          python -m venv /tmp/wheel-check
          /tmp/wheel-check/bin/pip install dist/*.whl
          expected="$(grep '^version = ' pyproject.toml | cut -d'"' -f2)"
          test "$(/tmp/wheel-check/bin/fraeno --version)" = "$expected"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fraeno-wheel
          path: dist/*.whl
          if-no-files-found: error

  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.10"
          cache: pip
      - run: python -m pip install ".[dev]"
      - run: pytest --cov=fraeno --cov-report=term-missing
      - run: ruff check .
      - run: mypy src

  browser:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:e2e

  container:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build isolated validation runner
        run: docker build --file runner/Dockerfile --tag fraeno-runner:test .
      - name: Test external repository and hostile candidate
        run: |
          runner_version="$(
            docker image inspect \
              --format '{{index .Config.Labels "org.opencontainers.image.version"}}' \
              fraeno-runner:test
          )"
          bash tests/container/test-external-runner.sh \
            fraeno-runner:test \
            "$runner_version"
      - name: Test docs-only onboarding repository
        run: bash tests/container/test-onboarding.sh fraeno-runner:test
      - name: Keep Git credentials outside the update container
        run: >-
          bash tests/container/test-update-workflow-sandbox.sh
          fraeno-runner:test

  ros-integration:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build trusted ROS 2 runner
        run: >-
          docker build
          --file fixtures/ros2_qos_robot/Dockerfile.runner
          --tag fraeno-ros2-runner:test
          .
      - name: Prepare independent workspaces
        run: |
          cp -a . /tmp/fraeno-baseline
          cp -a . /tmp/fraeno-safe
          cp -a . /tmp/fraeno-broken
          cp fixtures/ros2_qos_robot/profiles/safe.txt /tmp/fraeno-safe/fixtures/ros2_qos_robot/fraeno-fixture-version.txt
          cp fixtures/ros2_qos_robot/profiles/broken.txt /tmp/fraeno-broken/fixtures/ros2_qos_robot/fraeno-fixture-version.txt
      - name: Compatible update passes live ROS 2 validation
        run: >-
          docker run --rm
          --volume /tmp/fraeno-baseline:/work/baseline
          --volume /tmp/fraeno-safe:/work/candidate
          --volume "$PWD:/output"
          fraeno-ros2-runner:test
          fraeno validate
          --baseline /work/baseline
          --candidate /work/candidate
          --config /work/baseline/.fraeno.yml
          --output /output/fraeno-safe-report.json
      - name: QoS-breaking update is blocked
        run: |
          set +e
          docker run --rm \
            --volume /tmp/fraeno-baseline:/work/baseline \
            --volume /tmp/fraeno-broken:/work/candidate \
            --volume "$PWD:/output" \
            fraeno-ros2-runner:test \
            fraeno validate \
            --baseline /work/baseline \
            --candidate /work/candidate \
            --config /work/baseline/.fraeno.yml \
            --output /output/fraeno-broken-report.json
          result=$?
          set -e
          test "$result" -eq 1
      - name: Upload ROS 2 evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fraeno-ros2-evidence
          path: fraeno-*-report.json
          if-no-files-found: error
          retention-days: 14
